version: '3.8'

# =========================================================================
# Demo Example 1: Basic 4-Tier Microservice Stack
# =========================================================================
# Standard entry point reverse proxy, application API, Redis cache,
# and relational database store.
# =========================================================================

services:
  web:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - api

  api:
    image: node:18-alpine
    deploy:
      replicas: 4
    depends_on:
      - redis
      - db

  redis:
    image: redis:alpine
    deploy:
      replicas: 2

  db:
    image: postgres:15
    deploy:
      replicas: 1
