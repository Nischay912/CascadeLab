# =========================================================================
# CascadeLab Master Architecture Specification Boilerplate
# =========================================================================
# Paste this file into CascadeLab (via the "Import Architecture" button)
# to simulate, visualize, and monitor your distributed microservices system.
#
# All fields below are fully configurable.
# =========================================================================

# System Metadata
name: "Enterprise Microservices Platform"
description: "Distributed cloud microservices topology with autoscaling, circuit breakers, and retry backoff."

# 1. Target Service Level Objectives (SLOs)
slo:
  success_pct: 99.5       # Availability SLO target (e.g., 99.5% uptime)
  p95_ms: 500             # Target p95 latency ceiling in milliseconds

# Economic Impact (₹ per transaction, used for calculating financial loss during incidents)
value_per_request_inr: 50

# 2. Ingress Traffic & Workload Profile
workload:
  entry: "api-gateway"    # ID of the service that receives external user traffic
  pattern: "constant"     # Traffic pattern: constant | ramp | spike | diurnal | flash_sale
  base_rps: 600           # Steady-state offered requests per second (RPS)
  multiplier: 1.0         # Load multiplier (e.g., 2.0 for 2x traffic surge)
  duration_s: 180         # Total simulation window duration in seconds
  ramp_time_s: 30         # Ramp duration for gradual traffic increase

# 3. Microservice Fleet Definitions
services:
  # --- Edge Ingress ---
  - id: "api-gateway"
    name: "API Gateway"
    role: "Reverse Proxy & TLS Termination"
    entry: true
    # Optional canvas coordinates. Omit 'position' to let Dagre auto-layout.
    position: { x: 100, y: 180 }
    instances:
      initial: 4          # Starting replica count
      min: 2              # Autoscaling minimum floor
      max: 12             # Maximum horizontal scaling ceiling
    concurrency: 50       # Worker threads/slots per instance
    service_time_ms: 8    # Own compute latency (excluding downstream calls)
    queue_limit: 250      # Request backlog queue capacity per replica
    load_shedding:
      enabled: true       # Drop excess low-priority requests during saturation
      threshold: 0.85     # Queue saturation ratio (0.1 - 1.0) to trigger drops
    autoscale:
      enabled: true
      target_util: 0.65   # Target worker utilization (65%)
      eval_period_s: 10   # Metric evaluation window (seconds)
      startup_delay_s: 15 # Pod cold-start provisioning delay
      cooldown_s: 60      # Cooldown delay before downscaling
    crash:
      enabled: true       # Fail workers if saturated for too long
      after_overload_s: 20
      restart_delay_s: 30
    cost_inr_per_instance_month: 2500
    zone_spread: ["a", "b"] # Multi-AZ deployment zones

  # --- Core Business Logic Service ---
  - id: "order-service"
    name: "Order Processing Service"
    role: "Transaction Orchestration"
    position: { x: 420, y: 100 }
    instances:
      initial: 3
      min: 2
      max: 8
    concurrency: 30
    service_time_ms: 25
    queue_limit: 150
    load_shedding:
      enabled: true
      threshold: 0.80
    autoscale:
      enabled: true
      target_util: 0.70
      eval_period_s: 15
      startup_delay_s: 20
      cooldown_s: 90
    crash:
      enabled: true
      after_overload_s: 20
      restart_delay_s: 30
    cost_inr_per_instance_month: 3200
    zone_spread: ["a", "b"]

  # --- In-Memory State & Cache Layer ---
  - id: "redis-cache"
    name: "Redis State Cache"
    role: "In-Memory Session & Catalog Cache"
    position: { x: 740, y: 60 }
    instances:
      initial: 2
      min: 2
      max: 4
    concurrency: 80
    service_time_ms: 3
    queue_limit: 500
    load_shedding:
      enabled: false
      threshold: 0.8
    autoscale:
      enabled: false
      target_util: 0.6
      eval_period_s: 15
      startup_delay_s: 45
      cooldown_s: 120
    crash:
      enabled: true
      after_overload_s: 20
      restart_delay_s: 30
    cost_inr_per_instance_month: 1800
    zone_spread: ["a", "b"]

  # --- Persistent Database Layer ---
  - id: "orders-db"
    name: "PostgreSQL Database"
    role: "Relational ACID Store"
    position: { x: 740, y: 240 }
    instances:
      initial: 2
      min: 2
      max: 4
    concurrency: 40
    service_time_ms: 18
    queue_limit: 200
    load_shedding:
      enabled: false
      threshold: 0.8
    autoscale:
      enabled: true
      target_util: 0.75
      eval_period_s: 15
      startup_delay_s: 30
      cooldown_s: 120
    crash:
      enabled: true
      after_overload_s: 20
      restart_delay_s: 30
    cost_inr_per_instance_month: 6000
    zone_spread: ["a", "b"]

  # --- External Third-Party Dependency ---
  - id: "payment-gateway"
    name: "Payment Partner API"
    role: "External Settlement Provider"
    position: { x: 1060, y: 180 }
    instances:
      initial: 2
      min: 2
      max: 4
    concurrency: 25
    service_time_ms: 80
    queue_limit: 100
    load_shedding:
      enabled: false
      threshold: 0.8
    autoscale:
      enabled: false
      target_util: 0.6
      eval_period_s: 15
      startup_delay_s: 45
      cooldown_s: 120
    crash:
      enabled: false
      after_overload_s: 20
      restart_delay_s: 30
    cost_inr_per_instance_month: 0
    zone_spread: ["a"]

# 4. Directed Dependency Graph & Edge Policies
edges:
  # Gateway -> Order Service
  - from: "api-gateway"
    to: "order-service"
    calls_per_request: 1.0
    mode: "sync"          # sync (blocks caller worker) or async (fire-and-forget)
    critical: true        # If callee fails, does caller fail?
    timeout_ms: 600       # Deadline timeout before caller aborts
    retries: 2            # Number of retries on timeout/error
    backoff:
      mode: "exponential" # none | fixed | exponential
      jitter: true        # Random jitter to prevent retry storms
      base_delay_ms: 50
      max_delay_ms: 500
    circuit_breaker:
      enabled: true
      failure_rate_threshold: 0.40 # Open breaker at 40% error rate
      min_calls: 10       # Minimum calls before evaluating health
      open_duration_s: 15 # Seconds to fast-fail before probing half-open
      probe_fraction: 0.1 # Canary request ratio to test recovery

  # Order Service -> Redis Cache
  - from: "order-service"
    to: "redis-cache"
    calls_per_request: 2.0
    mode: "sync"
    critical: false       # Soft dependency: fallback to DB if cache misses
    timeout_ms: 100
    retries: 1
    cache:
      hit_ratio: 0.80     # Absorbs 80% of read queries
      warm_time_s: 20

  # Order Service -> PostgreSQL DB
  - from: "order-service"
    to: "orders-db"
    calls_per_request: 1.0
    mode: "sync"
    critical: true
    timeout_ms: 500
    retries: 1
    backoff:
      mode: "exponential"
      jitter: true
      base_delay_ms: 30
      max_delay_ms: 300
    bulkhead_max_concurrent: 25 # Concurrency isolation slot ceiling

  # Order Service -> Payment Partner Gateway
  - from: "order-service"
    to: "payment-gateway"
    calls_per_request: 1.0
    mode: "sync"
    critical: true
    timeout_ms: 1200
    retries: 1
    backoff:
      mode: "exponential"
      jitter: true
      base_delay_ms: 100
      max_delay_ms: 1000
    circuit_breaker:
      enabled: true
      failure_rate_threshold: 0.35
      min_calls: 5
      open_duration_s: 20
      probe_fraction: 0.1

# 5. Fault Injections (Optional)
faults:
  - id: "partner_hang"
    type: "latency"
    target: "payment-gateway"
    factor: 4.0           # 4x latency slowdown on payment partner
    start_s: 60
    end_s: 120

# Deterministic Simulation Seed
seed: 42
